name: Promote SynergyChat image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to promote to
        required: true
        type: choice
        options:
          - stage
          - prod
        default: stage
      image_tag:
        description: Full application image commit SHA to promote
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Open promotion PR
    runs-on: ubuntu-latest

    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v4
        with:
          repository: sandipan1/devops-for-ai
          token: ${{ secrets.DEVOPS_REPO_TOKEN }}
          path: devops-repo
          ref: main

      - name: Update environment image tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
        working-directory: devops-repo
        run: |
          set -euo pipefail

          values_file="charts/synchat/values-${ENVIRONMENT}.yaml"
          test -f "${values_file}"

          if ! printf '%s' "${IMAGE_TAG}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "image_tag must be a full 40-character Git commit SHA"
            exit 1
          fi

          sed -i -E "s/^    tag: .*/    tag: ${IMAGE_TAG}/" "${values_file}"

          grep -q "tag: ${IMAGE_TAG}" "${values_file}"

      - name: Open promotion pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DEVOPS_REPO_TOKEN }}
          path: devops-repo
          branch: promote/synchat-${{ inputs.environment }}-${{ inputs.image_tag }}
          commit-message: "Promote Synchat ${{ inputs.image_tag }} to ${{ inputs.environment }}"
          title: "Promote Synchat ${{ inputs.image_tag }} to ${{ inputs.environment }}"
          body: |
            Promotes the already-built Synchat images to `${{ inputs.environment }}`.

            Image tag: `${{ inputs.image_tag }}`

            This PR changes only the environment image tag. Argo CD will deploy
            the change after this PR is reviewed and merged.
          delete-branch: true
