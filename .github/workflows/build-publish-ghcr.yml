name: Build and publish SynergyChat images

on:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "vendor/**"
      - "Makefile"
      - ".github/workflows/build-publish-ghcr.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and publish container images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Build production binaries
        run: make buildprod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          for service in web api crawler; do
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file "cmd/${service}/Dockerfile" \
              --tag "ghcr.io/${IMAGE_OWNER}/synergychat-${service}:${IMAGE_TAG}" \
              --push \
              "cmd/${service}"
          done

      - name: Check out deployment repository
        uses: actions/checkout@v4
        with:
          repository: sandipan1/devops-for-ai
          token: ${{ secrets.DEVOPS_REPO_TOKEN }}
          path: devops-repo
          ref: main

      - name: Update development image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        working-directory: devops-repo
        run: |
          set -euo pipefail

          for file in charts/synchat/values.yaml charts/synchat/values-dev.yaml; do
            sed -i -E "s/^    tag: .*/    tag: ${IMAGE_TAG}/" "${file}"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/synchat/values.yaml charts/synchat/values-dev.yaml

          if git diff --cached --quiet; then
            echo "Development image tags are already up to date."
            exit 0
          fi

          git commit -m "Deploy Synchat ${IMAGE_TAG} to development"
          git push origin main
